version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
    groups:
      compose:
        patterns:
          - "androidx.compose*"
          - "androidx.activity*"
      ktor:
        patterns:
          - "io.ktor*"

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - backend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci

  - package-ecosystem: pip
    directory: /popcoon-tdd
    schedule:
      interval: monthly
    labels:
      - dependencies
      - python
