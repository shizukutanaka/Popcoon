name: 機能リクエスト
description: 新機能・改善の提案
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Popcoon への提案ありがとうございます。
        Carmack/Martin/Pike 哲学 (性能・シンプルさ・ゼロ依存) に沿う提案を歓迎する。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どんな問題・不便を解決したいか
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
      description: どう実現したいか
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他の方法を検討した場合は記載
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: カテゴリ
      options:
        - 価格比較・検索
        - ダークパターン検出
        - 買い時判定・予測
        - レビュー信頼性
        - 通知・ウォッチリスト
        - UI/UX・アクセシビリティ
        - 国際化 (i18n)
        - その他
    validations:
      required: true

  - type: checkboxes
    id: principles
    attributes:
      label: 設計原則の確認
      options:
        - label: この提案はテレメトリゼロ (個人情報を収集しない) の方針に反しない
          required: true
        - label: 外部依存を最小限に保つ方針を理解している
          required: false
