name = "popcoon-backend"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true

# ── KV namespaces ────────────────────────────────────────────────────────────
# デプロイ前に以下を実行してIDを取得してください:
#   wrangler kv:namespace create PRICE_HISTORY
#   wrangler kv:namespace create DEVICE_TOKENS
#   wrangler kv:namespace create ALERTS
#   wrangler kv:namespace create RATE_LIMIT
# 取得したIDを id = "..." に設定してください。
# CI/CD 環境では CLOUDFLARE_KV_PRICE_HISTORY_ID 等の環境変数で管理推奨。

[[kv_namespaces]]
binding = "PRICE_HISTORY"
id = "${CLOUDFLARE_KV_PRICE_HISTORY_ID}"    # 例: abc123def456...

[[kv_namespaces]]
binding = "DEVICE_TOKENS"
id = "${CLOUDFLARE_KV_DEVICE_TOKENS_ID}"

[[kv_namespaces]]
binding = "ALERTS"
id = "${CLOUDFLARE_KV_ALERTS_ID}"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "${CLOUDFLARE_KV_RATE_LIMIT_ID}"

# ── Secrets (wrangler secret put で設定) ─────────────────────────────────────
# FCM_SERVER_KEY     : Firebase Cloud Messaging サーバーキー
# ADMIN_API_KEY      : 管理 API 認証用 (内部)
# ANTHROPIC_API_KEY  : Claude API (POST /v1/advice が使用)。未設定でも
#                      /v1/advice は 503 を返すだけで他エンドポイントは動作する。
# wrangler secret put FCM_SERVER_KEY
# wrangler secret put ADMIN_API_KEY
# wrangler secret put ANTHROPIC_API_KEY

[vars]
ENVIRONMENT = "production"
MAX_HISTORY_PER_PRODUCT = "365"   # 1年分の価格履歴

# ── Rate Limiting bindings (2025-09 GA) ─────────────────────────────────────
# ネイティブのレート制限。per-PoP の近似カウンターだがアトミックで、KV カウンター
# (レースあり + リクエスト毎に read/write を消費し無料枠を圧迫) を置き換える。
# binding 未設定の古いデプロイでも src/index.ts は KV パスへフォールバックする。
# namespace_id は アカウント内で binding 毎に一意な任意の正整数。

[[ratelimits]]
binding = "WRITE_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }    # 書き込み系 5回/分/IP

[[ratelimits]]
binding = "READ_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }   # 読み取り系 30回/分/IP

[[ratelimits]]
binding = "ADVICE_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 3, period = 60 }    # LLM プロキシ 3回/分/IP (課金コスト保護)

# ── Triggers: 毎時アラート評価 ───────────────────────────────────────────────
[triggers]
crons = ["0 * * * *"]
