# detekt configuration for Popcoon
# 商用 Android アプリの標準設定
# Kotlin スタイルガイド + Robert C. Martin 原則に準拠

build:
  maxIssues: 0
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  ComplexMethod:
    active: true
    threshold: 15
    ignoreSingleWhenExpression: true  # when は複雑でも許容
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LongMethod:
    active: true
    threshold: 60
    ignoreAnnotated: ['Composable', 'Preview']  # Compose は長くなりがち
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 8  # Hilt @Inject constructors はやや多め
    ignoreAnnotated: ['HiltViewModel']
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 25
    thresholdInInterfaces: 15
    thresholdInObjects: 20
    thresholdInEnums: 10
  StringLiteralDuplication:
    active: true
    threshold: 3
    ignoreAnnotated: ['Preview']
  NamedArguments:
    active: false  # Compose では名前付き引数が多すぎる

style:
  active: true
  MagicNumber:
    active: true
    # 一般的な数値は許容
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      - '10'
      - '12'
      - '16'
      - '24'
      - '100'
      - '200'
      - '1000'
    ignoreAnnotated:
      - 'Composable'
      - 'Preview'
    ignorePropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreEnums: true
    ignoreLocalVariableDeclaration: false
    ignoreHashCodeFunction: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    ignoreComments: true
    ignoreStrings: true
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true  # Early return guard clause は許容
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
  ForbiddenComment:
    active: true
    comments:
      - reason: 'FIXME はリリース前に解決すること'
        value: 'FIXME'
    allowedPatterns: ''
  ThrowsCount:
    active: true
    max: 3
  DataClassContainsFunctions:
    active: false  # DTO に utility 関数は許容
  UseDataClass:
    active: true
    ignoreAnnotated:
      - 'HiltViewModel'

formatting:
  active: false  # ktlint で別途チェック

performance:
  active: true
  SpreadOperator:
    active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  EqualsWithHashCodeExist:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  NullableToStringCall:
    active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true  # GlobalScope の使用を警告
  InjectDispatcher:
    active: false  # Hilt によるDispatcher injection は任意

naming:
  active: true
  ClassNaming:
    classPattern: '[A-Z][a-zA-Z0-9]*'
  FunctionNaming:
    functionPattern: '[a-z][a-zA-Z0-9]*'
    ignoreAnnotated:
      - 'Composable'  # Composable は大文字開始でも OK
  VariableNaming:
    variablePattern: '[a-z][a-zA-Z0-9]*'
    privateVariablePattern: '_?[a-z][a-zA-Z0-9]*'
  PackageNaming:
    packagePattern: '[a-z]+(\.[a-z][a-z0-9]*)*'

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false  # runCatching + apiCallSuspend が Exception を汎用的に使うため
  TooGenericExceptionThrown:
    active: true
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - InterruptedException
      - MalformedURLException
      - NumberFormatException
      - ParseException

comments:
  active: true
  UndocumentedPublicClass:
    active: false  # Composable screens は省略許容
  UndocumentedPublicFunction:
    active: false
