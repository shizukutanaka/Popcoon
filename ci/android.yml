name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一ブランチで新しい push があれば古い実行をキャンセル（CI 時間節約）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Kotlin / Android: 静的解析・lint・単体テスト・Debug ビルド ──────────────
  android:
    name: Android (detekt / lint / unit tests / assemble)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # detekt（静的解析）→ lint → 単体テスト → Debug APK。
      # 失敗箇所を切り分けやすいよう個別タスクで実行する。
      - name: detekt
        run: ./gradlew detekt --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests (kotest)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Debug
        run: ./gradlew assembleDebug --stacktrace

      # release ビルド (isMinifyEnabled=true, isShrinkResources=true) は一度も CI で
      # 検証されておらず、kotlinx.serialization/Room/Hilt/Ktor の R8 圧縮起因の破壊が
      # 未検出のまま出荷されるリスクがあった (商用リリース監査で発見)。実配布用の
      # 秘密鍵は要らない — CI 実行のたびに使い捨てのキーストアを生成し、
      # signingConfig を満たして assembleRelease のパイプライン全体
      # (圧縮・リソース shrink・署名・パッケージング) を最後まで走らせるだけで、
      # 生成される APK は誰も鍵を持たないため配布には使えない。
      - name: Generate throwaway keystore for release-build CI verification
        run: |
          keytool -genkeypair -v -keystore /tmp/ci-release.jks \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-only-not-for-distribution \
            -keypass ci-only-not-for-distribution \
            -dname "CN=CI, OU=CI, O=Popcoon, L=CI, S=CI, C=JP"

      - name: Assemble Release (R8/shrink verification — not for distribution)
        env:
          KEYSTORE_PATH: /tmp/ci-release.jks
          KEYSTORE_PASSWORD: ci-only-not-for-distribution
          KEY_ALIAS: ci
          KEY_PASSWORD: ci-only-not-for-distribution
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/detekt/
          if-no-files-found: ignore

  # ── Python TDD オラクル: 差分テストの正本 ────────────────────────────────
  python-oracle:
    name: Python TDD oracle (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        working-directory: popcoon-tdd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ベンチマークは CI では計測ノイズになるため無効化し、機能テストのみ検証。
      - name: Run pytest
        working-directory: popcoon-tdd
        run: python -m pytest -q --benchmark-disable

  # ── Kotlin パリティ & マッパー: Android SDK 無しで純粋ロジックを実行検証 ──────
  # Gradle 同梱の kotlin-compiler-embeddable で純関数 (customs/eco/予測/買い時/在庫マッパー)
  # をコンパイル・実行し、Python オラクルと照合する。app の full ビルド (android job) とは独立に
  # 「移植ロジックのパリティ」を高速検証する経路。
  parity:
    name: Kotlin parity & mappers (no SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python (compare_oracle.py)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make scripts executable
        run: chmod +x ./gradlew popcoon-tdd/kotlin_parity/*.sh

      - name: Run parity & mapper harnesses
        run: bash popcoon-tdd/kotlin_parity/run_all.sh

  # ── Backend (Cloudflare Worker): アラート/PII/ページネーション/検証の単体テスト ──
  backend:
    name: Backend (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: backend
        run: npm install

      # 型検査はテストとは別の失敗モードを拾う (テストが触らない経路の型崩れ)。
      # ローカルの ci/verify.py は tsc も回すので、CI 側にも同じゲートを置いて揃える。
      - name: Type check (tsc)
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run vitest
        working-directory: backend
        run: npm test

