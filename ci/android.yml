name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一ブランチで新しい push があれば古い実行をキャンセル（CI 時間節約）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Kotlin / Android: 静的解析・lint・単体テスト・Debug ビルド ──────────────
  android:
    name: Android (detekt / lint / unit tests / assemble)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # detekt（静的解析）→ lint → 単体テスト → Debug APK。
      # 失敗箇所を切り分けやすいよう個別タスクで実行する。
      - name: detekt
        run: ./gradlew detekt --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Unit tests (kotest)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/detekt/
          if-no-files-found: ignore

  # ── Python TDD オラクル: 差分テストの正本 ────────────────────────────────
  python-oracle:
    name: Python TDD oracle (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        working-directory: popcoon-tdd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ベンチマークは CI では計測ノイズになるため無効化し、機能テストのみ検証。
      - name: Run pytest
        working-directory: popcoon-tdd
        run: python -m pytest -q --benchmark-disable
