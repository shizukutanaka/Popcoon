// Compose Compiler 安定性設定ファイル
// ─────────────────────────────────────────────────────────────────────────────
// ここに列挙したクラスを Compose コンパイラは「stable (安定)」とみなし、
// @Composable 関数の引数に渡されても、内容が変わらない限り再コンポーズを skip する。
//
// なぜ必要か (Qiita/Zenn のパフォーマンス記事で繰り返し指摘される論点):
//  - data class が List / Map を 1 つでも持つと、Compose は「中身が変わるかも」と判断し
//    unstable と推論する。要素が不変でも List インターフェース自体が可変実装を許すため。
//  - unstable な引数を持つ Composable は skippable にならず、親が再コンポーズするたびに
//    無条件で再実行される (LazyColumn のスクロールで全行が毎回再構築される等)。
//
// なぜ設定ファイルか (アノテーションではなく):
//  - feature/ と data/model のドメインモデルは「Android 非依存の純関数」を設計原則とする。
//    そこに androidx.compose.runtime.@Immutable を import すると Compose への結合が生じる。
//  - 設定ファイルなら、ソースを一切変更せず・純粋性を保ったまま安定性を宣言できる。
//
// 安全性: 列挙した全クラスは全プロパティ val・深く不変 (pure function の出力で、
//         構築後に変更されない) であることをコードレビューで確認済み。
//         可変クラス (AdviceCache / Trie / BillingManager 等) は意図的に除外している。

